<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>성 쌓기 땅따먹기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root{
  --night:#17142b;--night-2:#231e40;--ink:#0d0b18;
  --panel:#2b2550;--panel-hi:#3b3470;
  --stone:#7d7f99;--stone-hi:#a9abc4;--stone-lo:#4b4d66;
  --blue:#3b6fe0;--blue-hi:#7aa2ff;--blue-lo:#1d3b8f;
  --orange:#f07a22;--orange-hi:#ffb066;--orange-lo:#9a4210;
  --gold:#ffd23f;--paper:#f3ecd6;--dim:#a99fcf;--red:#ff3e4d;
  --px:"Galmuri11","Galmuri9",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--px);font-size:15px;line-height:1.5;
  background-image:
    linear-gradient(var(--night-2) 0 0),
    radial-gradient(circle,#fff 0 1px,transparent 1.5px);
  background-size:100% 40%,0 0;background-repeat:no-repeat;
  -webkit-font-smoothing:none}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;image-rendering:pixelated;width:100%;height:100%}
.app{position:relative;z-index:1;display:grid;grid-template-columns:280px auto;gap:24px;justify-content:center;align-items:start;padding:20px 16px;min-height:100%}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr);justify-items:center;gap:14px;padding:12px}.field{order:-1}}

/* 왼쪽 패널 */
.side{display:flex;flex-direction:column;gap:14px;width:100%;max-width:520px;min-width:0}
.title{display:flex;align-items:center;gap:10px}
.title canvas{width:44px;height:44px;flex:0 0 auto;image-rendering:pixelated}
.title h1{font-family:"Galmuri14",var(--px);font-weight:700;font-size:24px;line-height:1;margin:0;white-space:nowrap;color:var(--gold);
  text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.title p{margin:6px 0 0;font-size:12px;color:var(--dim)}
.box{background:var(--panel);border:3px solid var(--ink);box-shadow:inset 3px 3px 0 var(--panel-hi),inset -3px -3px 0 #1c1838,4px 4px 0 var(--ink);padding:12px}
.status{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;min-height:28px}
.status i{width:16px;height:16px;border:3px solid var(--ink);flex:0 0 auto;display:block}
.msg{font-size:12px;color:var(--dim);min-height:36px;margin-top:4px}
.msg.err{color:#ff8a93}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flag{position:relative;padding:8px 6px 18px;text-align:center;border:3px solid var(--ink);border-bottom:0;
  clip-path:polygon(0 0,100% 0,100% 100%,75% 100%,75% 88%,50% 88%,50% 76%,50% 88%,25% 88%,25% 100%,0 100%)}
.flag.b{background:var(--blue);box-shadow:inset 3px 3px 0 var(--blue-hi),inset -3px 0 0 var(--blue-lo)}
.flag.o{background:var(--orange);box-shadow:inset 3px 3px 0 var(--orange-hi),inset -3px 0 0 var(--orange-lo)}
.flag .k{font-size:11px}
.flag .v{font-family:"Galmuri14",var(--px);font-size:30px;font-weight:700;line-height:1.1;text-shadow:2px 2px 0 var(--ink)}
.flag.turn{outline:3px solid var(--gold);outline-offset:-9px}
.row{display:flex;flex-wrap:wrap;gap:8px}
select,.btn{font-family:var(--px);font-size:14px;color:var(--paper);background:var(--panel-hi);border:3px solid var(--ink);
  box-shadow:inset 2px 2px 0 #5a52a0,inset -2px -2px 0 #262050,3px 3px 0 var(--ink);padding:8px 10px;cursor:pointer;border-radius:0}
select{flex:1 1 140px}
.btn{flex:1 1 auto}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:inset 2px 2px 0 #5a52a0,inset -2px -2px 0 #262050}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:inset 2px 2px 0 #fff3a6,inset -2px -2px 0 #b88f00,3px 3px 0 var(--ink);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
select:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.judge{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
.judge b{color:var(--paper)}
.toggles{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dim);margin-top:10px}
.toggles input{accent-color:var(--gold)}
.credit{font-size:10px;color:#7d74a8}
.credit a{color:#a99fff}

/* 판 */
.field{position:relative;--size:min(calc(100vh - 40px),calc(100vw - 352px));width:var(--size);max-width:900px}
@media (max-width:900px){.field{--size:calc(100vw - 24px)}}
.wall{padding:clamp(6px,1.6vw,14px);background:var(--stone);border:4px solid var(--ink);
  box-shadow:inset 4px 4px 0 var(--stone-hi),inset -4px -4px 0 var(--stone-lo),6px 6px 0 var(--ink);
  background-image:linear-gradient(90deg,transparent 0 46%,var(--stone-lo) 46% 50%,transparent 50%),linear-gradient(transparent 0 46%,var(--stone-lo) 46% 50%,transparent 50%);
  background-size:28px 14px}
.board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);aspect-ratio:1;border:4px solid var(--ink);user-select:none;-webkit-tap-highlight-color:transparent}
.cell{position:relative;min-width:0;min-height:0;border:0;padding:0;margin:0;cursor:pointer;background-color:#5aa04a;background-size:100% 100%;image-rendering:pixelated;display:grid;place-items:center;font:inherit;color:inherit}
.cell img{width:88%;height:88%;image-rendering:pixelated;position:relative;z-index:1;pointer-events:none}
.cell img.mark{width:56%;height:56%;position:absolute;opacity:.9;z-index:0}
.cell.t1::before,.cell.t2::before{content:"";position:absolute;inset:0;z-index:0}
.cell.t1::before{background:#3b6fe066;box-shadow:inset 0 0 0 3px #3b6fe0aa}
.cell.t2::before{background:#f07a2266;box-shadow:inset 0 0 0 3px #f07a22aa}
.cell.no .x{position:absolute;font-size:clamp(14px,3vw,30px);color:#fff;opacity:.55;text-shadow:2px 2px 0 var(--ink)}
@media (hover:hover){.cell.open:hover::after{content:"";position:absolute;inset:8%;border:3px dashed #fffc;z-index:2}}
.cell:focus-visible{outline:4px solid var(--gold);outline-offset:-4px;z-index:3}
.cell.atari::after{content:"";position:absolute;inset:0;border:4px solid var(--red);z-index:2;animation:blink .6s steps(2) infinite}
.cell.two::after{content:"";position:absolute;inset:0;border:4px solid var(--gold);z-index:2}
@keyframes blink{50%{border-color:transparent}}
.cell.last img:not(.mark){animation:drop .32s steps(4)}
@keyframes drop{0%{transform:translateY(-70%)}75%{transform:translateY(6%)}100%{transform:none}}
.cell.last .pin{position:absolute;top:5%;left:5%;width:14%;height:14%;background:var(--gold);border:2px solid var(--ink);z-index:3}
.cell.dead img{animation:shake .5s steps(5)}
@keyframes shake{20%{transform:translateX(-10%)}40%{transform:translateX(10%)}60%{transform:translateX(-6%)}80%{transform:translateX(4%)}}
.libs{position:absolute;right:6%;bottom:2%;z-index:3;font-family:"Galmuri14",var(--px);font-weight:700;font-size:clamp(12px,2.4vw,22px);color:#fff;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink)}

.win{position:absolute;inset:0;display:none;place-items:center;z-index:5;background:#0d0b1888}
.win.show{display:grid}
.dialog{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 4px 4px 0 var(--panel-hi),inset -4px -4px 0 #1c1838,6px 6px 0 var(--ink);padding:20px 26px;text-align:center;max-width:86%;animation:pop .3s steps(3)}
.dialog canvas{width:72px;height:72px;image-rendering:pixelated}
.dialog h2{font-family:"Galmuri14",var(--px);font-size:26px;margin:6px 0;color:var(--gold);text-shadow:3px 3px 0 var(--ink)}
.dialog p{margin:0 0 14px;font-size:13px;color:var(--dim)}
@keyframes pop{from{transform:scale(.6)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="app">
  <aside class="side">
    <div class="title">
      <canvas id="logo" width="16" height="16"></canvas>
      <div><h1>성 쌓기 땅따먹기</h1><p>그레이트 킹덤 규칙 연습용 · 내 성은 갇히지 않게</p></div>
    </div>

    <div class="box">
      <div class="status" id="status"></div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="scores" aria-label="영토 칸 수">
        <div class="flag b" id="banB"><div class="k">파랑 영토</div><div class="v" id="sb">0</div></div>
        <div class="flag o" id="banO"><div class="k">주황 영토</div><div class="v" id="so">0</div></div>
      </div>
      <div class="judge" id="judge"></div>
    </div>

    <div class="box">
      <div class="row">
        <select id="opp" aria-label="상대">
          <option value="easy">컴퓨터 · 쉬움</option>
          <option value="normal" selected>컴퓨터 · 보통</option>
          <option value="hard">컴퓨터 · 어려움</option>
          <option value="human">옆 사람과 두기</option>
        </select>
        <select id="mine" aria-label="내 색">
          <option value="1" selected>나는 파랑 (먼저)</option>
          <option value="2">나는 주황 (나중)</option>
        </select>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn gold" id="newBtn">새 판</button>
        <button class="btn" id="passBtn">패스</button>
        <button class="btn" id="undoBtn">무르기</button>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="tTerr" checked> 영토 표시</label>
        <label><input type="checkbox" id="tDanger" checked> 위험 테두리 (빨강 = 숨구멍 1개, 노랑 = 2개)</label>
        <label><input type="checkbox" id="tLibs"> 숨구멍 숫자</label>
      </div>
    </div>

    <p class="credit">코리아보드게임즈와 무관한 비공식 연습판이에요. 그레이트 킹덤은 해당 회사의 게임이에요.<br>규칙 영상 <a href="https://youtu.be/CfHRVZ1glO4" target="_blank" rel="noopener">공식</a> · <a href="https://youtu.be/axze9vCOg5o" target="_blank" rel="noopener">현옹</a> · 글꼴 <a href="https://galmuri.quiple.dev" target="_blank" rel="noopener">갈무리</a> (OFL)</p>
  </aside>

  <main class="field">
    <div class="wall"><div class="board" id="board"></div></div>
    <div class="win" id="win"><div class="dialog">
      <canvas id="crown" width="16" height="16"></canvas>
      <h2 id="winTitle"></h2><p id="winSub"></p>
      <button class="btn gold" id="againBtn">한 판 더</button>
    </div></div>
  </main>
</div>

<script>
const N = 9, SZ = N * N;
const EMPTY = 0, BLUE = 1, ORANGE = 2, NEUT = 3;
const NAME = { 1: "파랑", 2: "주황" };
const NB = [];
for (let i = 0; i < SZ; i++) {
  const r = (i / N) | 0, c = i % N, a = [];
  if (r > 0) a.push(i - N);
  if (r < N - 1) a.push(i + N);
  if (c > 0) a.push(i - 1);
  if (c < N - 1) a.push(i + 1);
  NB.push(a);
}

// 영토: 빈칸에서 출발해 빈칸·상대 성을 지나며 퍼진다. 내 성·중립 성·판 끝이 벽.
// 안에 상대 성이 없고 네 변을 다 닿지 않으면 그 빈칸들이 내 영토.
function territory(b, color) {
  const opp = 3 - color, mask = new Uint8Array(SZ), seen = new Uint8Array(SZ);
  let count = 0;
  for (let s = 0; s < SZ; s++) {
    if (seen[s] || b[s] !== EMPTY) continue;
    const stack = [s], cells = [];
    let hasOpp = false, edges = 0;
    seen[s] = 1;
    while (stack.length) {
      const i = stack.pop();
      if (b[i] === opp) hasOpp = true; else cells.push(i);
      const r = (i / N) | 0, c = i % N;
      if (r === 0) edges |= 1;
      if (r === N - 1) edges |= 2;
      if (c === 0) edges |= 4;
      if (c === N - 1) edges |= 8;
      for (const j of NB[i]) {
        if (seen[j]) continue;
        if (b[j] === EMPTY || b[j] === opp) { seen[j] = 1; stack.push(j); }
      }
    }
    if (!hasOpp && edges !== 15) { for (const i of cells) mask[i] = 1; count += cells.length; }
  }
  return { mask, count };
}

function groupAt(b, s) {
  const col = b[s], stones = [s], seen = new Set([s]), libs = new Set();
  for (let k = 0; k < stones.length; k++) {
    for (const j of NB[stones[k]]) {
      if (b[j] === EMPTY) libs.add(j);
      else if (b[j] === col && !seen.has(j)) { seen.add(j); stones.push(j); }
    }
  }
  return { color: col, stones, libs };
}

function allGroups(b) {
  const seen = new Uint8Array(SZ), gs = [];
  for (let i = 0; i < SZ; i++) {
    if (seen[i] || (b[i] !== BLUE && b[i] !== ORANGE)) continue;
    const g = groupAt(b, i);
    for (const s of g.stones) seen[s] = 1;
    gs.push(g);
  }
  return gs;
}

// 놓을 수 있으면 {board, capture}, 아니면 {err}
function tryMove(b, i, color, oppMask) {
  if (b[i] !== EMPTY) return { err: "이미 성이 있는 칸이에요." };
  if (!oppMask) oppMask = territory(b, 3 - color).mask;
  if (oppMask[i]) return { err: "상대 마당이라 못 놓아요." };
  const nb = b.slice();
  nb[i] = color;
  let capture = false;
  for (const j of NB[i]) {
    if (nb[j] === 3 - color && groupAt(nb, j).libs.size === 0) { capture = true; break; }
  }
  if (!capture && groupAt(nb, i).libs.size === 0) return { err: "놓자마자 내 성이 갇히는 자리예요." };
  return { board: nb, capture };
}

function legalMoves(b, color) {
  const oppMask = territory(b, 3 - color).mask, out = [];
  for (let i = 0; i < SZ; i++) {
    if (b[i] !== EMPTY) continue;
    const r = tryMove(b, i, color, oppMask);
    if (!r.err) out.push({ i, board: r.board, capture: r.capture });
  }
  return out;
}

function distFrom(b, col) {
  const d = new Int16Array(SZ).fill(99), q = [];
  for (let i = 0; i < SZ; i++) if (b[i] === col) { d[i] = 0; q.push(i); }
  for (let k = 0; k < q.length; k++) {
    const i = q[k];
    for (const j of NB[i]) if (b[j] === EMPTY && d[j] > d[i] + 1) { d[j] = d[i] + 1; q.push(j); }
  }
  return d;
}

// me가 방금 두었고 상대 차례인 판의 점수 (me 기준)
function evaluate(b, me) {
  const opp = 3 - me;
  const tMe = territory(b, me), tOp = territory(b, opp);
  let safety = 0, oppAtari = 0;
  for (const g of allGroups(b)) {
    const n = g.libs.size;
    if (g.color === me) {
      let playable = 0;
      for (const l of g.libs) if (!tMe.mask[l]) playable++;
      if (n === 1 && playable) return -10000;
      if (n === 2 && playable) safety -= playable === 2 ? 6 : 3;
      else if (n === 3 && playable === 3) safety -= 1;
    } else {
      let playable = 0;
      for (const l of g.libs) if (!tOp.mask[l]) playable++;
      if (n === 1 && playable) oppAtari++;
      else if (n === 2 && playable === 2) safety += 2;
    }
  }
  if (oppAtari >= 2) safety += 60; else if (oppAtari === 1) safety += 5;
  const dm = distFrom(b, me), dp = distFrom(b, opp);
  let inf = 0;
  for (let i = 0; i < SZ; i++) {
    if (b[i] !== EMPTY) continue;
    if (dm[i] < dp[i]) inf += dm[i] <= 2 ? 1 : 0.4;
    else if (dp[i] < dm[i]) inf -= dp[i] <= 2 ? 1 : 0.4;
  }
  return (tMe.count - tOp.count) + inf * 0.5 + safety;
}

function finalWinner(b) {
  const tb = territory(b, BLUE).count, to = territory(b, ORANGE).count;
  return tb - to >= 3 ? BLUE : ORANGE;
}

// ---------- 수 읽기 (알파베타) ----------
// 몇 수 앞까지 서로 최선을 둔다고 보고 고른다. 정해 둔 시간 안에서 1수, 2수, 3수 … 점점 깊이 읽는다.
// 보통: 2수까지 (몰이는 끝까지 따라감) · 어려움: 2초 안에서 가능한 만큼
const WIN = 1e6, THINK = {
  normal: { ms: 500, depth: 2, width: [14, 10, 7, 5] },
  hard: { ms: 2000, depth: 30, width: [20, 14, 10, 8] },
};
let WIDTH = THINK.hard.width; // 깊이(수)마다 몇 개까지 볼지
let deadline = 0;
const TIMEOUT = {};

// 후보 수를 판 점수 순으로. 잡는 수가 있으면 null (바로 이김)
// near면 성에서 두 칸 안쪽 빈칸만 본다 (먼 빈칸까지 다 점수 매기면 깊이 못 읽는다)
let orderCache = new Map();
function orderedMoves(b, color, near) {
  const key = near ? color + b.join("") : "";
  if (near && orderCache.has(key)) return orderCache.get(key);
  let moves = legalMoves(b, color);
  for (const m of moves) if (m.capture) return null;
  if (near) {
    const d = new Int8Array(SZ).fill(9);
    for (let i = 0; i < SZ; i++) if (b[i] !== EMPTY) d[i] = 0;
    for (let k = 0; k < 2; k++)
      for (let i = 0; i < SZ; i++) if (d[i] === k) for (const j of NB[i]) if (d[j] > k + 1) d[j] = k + 1;
    moves = moves.filter(m => d[m.i] <= 2);
  }
  for (const m of moves) m.v = evaluate(m.board, color);
  moves.sort((a, c) => c.v - a.v);
  if (near) orderCache.set(key, moves.slice(0, WIDTH[1]));
  return moves;
}

// 읽기 끝에서 몰이(빈칸 1~2개 남은 성)만 더 따라가 본다. 몰이를 중간에 끊고 점수를 매기면 다 잡힌 성을 못 본다
function quiet(b, color, alpha, beta, ply, qd) {
  if (performance.now() > deadline) throw TIMEOUT;
  const opp = 3 - color, oppMask = territory(b, opp).mask, myMask = territory(b, color).mask;
  const urgent = new Set();
  let inAtari = false;
  for (const g of allGroups(b)) {
    if (g.libs.size > 2) continue;
    if (g.libs.size === 1) {
      const [l] = g.libs;
      if (g.color === opp && !oppMask[l]) return WIN - ply; // 지금 잡을 수 있다
      if (g.color === color && !myMask[l]) inAtari = true; // 손 안 쓰면 잡힌다
    }
    for (const l of g.libs) urgent.add(l);
  }
  // 단수가 아니면 "몰이 말고 딴 데 둔다"로 멈출 수 있다. 단수면 막아야만 한다
  const stand = -evaluate(b, opp);
  if (qd === 0) return stand;
  let best = inAtari ? -(WIN - ply - 1) : stand;
  if (best >= beta) return best;
  if (best > alpha) alpha = best;
  for (const i of urgent) {
    const r = tryMove(b, i, color, oppMask);
    if (r.err) continue;
    if (r.capture) return WIN - ply;
    const v = -quiet(r.board, opp, -beta, -alpha, ply + 1, qd - 1);
    if (v > best) best = v;
    if (v > alpha) alpha = v;
    if (alpha >= beta) break;
  }
  return best;
}

// color 차례인 판의 값 (color 기준). passes = 바로 앞이 패스였으면 1
function search(b, color, depth, alpha, beta, ply, passes) {
  if (performance.now() > deadline) throw TIMEOUT;
  if (depth === 0) return quiet(b, color, alpha, beta, ply, 10);
  const moves = orderedMoves(b, color, true);
  if (!moves) return WIN - ply;
  // 패스: 상대가 방금 패스했으면 여기서 끝나고 영토를 센다
  let best = passes
    ? (finalWinner(b) === color ? WIN - ply : -(WIN - ply))
    : -search(b, 3 - color, depth - 1, -beta, -alpha, ply + 1, 1);
  if (best > alpha) alpha = best;
  if (alpha >= beta) return best;
  const width = WIDTH[Math.min(ply, WIDTH.length - 1)];
  for (let k = 0; k < moves.length && k < width; k++) {
    const m = moves[k];
    const v = -search(m.board, 3 - color, depth - 1, -beta, -alpha, ply + 1, 0);
    if (v > best) best = v;
    if (v > alpha) alpha = v;
    if (alpha >= beta) break;
  }
  return best;
}

function thinkDeep(b, me, oppPassed, { ms, depth: maxDepth, width }) {
  WIDTH = width;
  deadline = performance.now() + ms;
  orderCache = new Map();
  const moves = orderedMoves(b, me);
  // 같은 점수면 매번 다른 수가 나오게 살짝 섞는다
  for (const m of moves) m.v += Math.random() * 0.05;
  moves.sort((a, c) => c.v - a.v);
  let pick = moves[0].i; // 1수 읽기도 못 끝내면 판 점수 1등
  for (let depth = 1; depth <= maxDepth; depth++) {
    try {
      // 패스보다 0.2 이상 나아야 둔다
      const passVal = oppPassed
        ? (finalWinner(b) === me ? WIN : -WIN)
        : -search(b, 3 - me, depth - 1, -Infinity, Infinity, 1, 1);
      // 지는 판이면 패스로 포기하지 않고 가장 덜 나쁜 수를 둔다
      let alpha = passVal < -WIN / 2 ? -Infinity : passVal + 0.2, best = -1;
      for (const m of moves) {
        const v = -search(m.board, 3 - me, depth - 1, -Infinity, -alpha, 1, 0);
        m.score = v;
        if (v > alpha || best < 0 && alpha === -Infinity) { alpha = v; best = m.i; }
      }
      pick = best;
      if (Math.abs(alpha) > WIN / 2) break; // 이기고 지는 게 이미 보이면 더 읽을 필요 없음
      // 다음 깊이는 이번에 좋았던 수부터 본다
      moves.sort((a, c) => c.score - a.score);
    } catch (e) {
      if (e !== TIMEOUT) throw e;
      break;
    }
  }
  return pick;
}

function aiChoose(b, me, level, oppPassed) {
  const moves = legalMoves(b, me);
  if (!moves.length) return -1;
  for (const m of moves) if (m.capture) return m.i;
  if (oppPassed && finalWinner(b) === me) return -1;
  if (level !== "easy") return thinkDeep(b, me, oppPassed, THINK[level]);
  if (Math.random() < 0.3) {
    const safe = moves.filter(m => evaluate(m.board, me) > -10000);
    const pool = safe.length ? safe : moves;
    return pool[(Math.random() * pool.length) | 0].i;
  }
  const scored = moves.map(m => ({ m, v: evaluate(m.board, me) + Math.random() * 6 }));
  scored.sort((a, c) => c.v - a.v);
  if (!oppPassed && scored[0].v <= evaluate(b, me) + 0.2) return -1;
  return scored[0].m.i;
}

// ---------- 도트 그림 ----------
const PAL = {
  1: { hi: "#7aa2ff", mid: "#3b6fe0", lo: "#1d3b8f", flag: "#ffd23f" },
  2: { hi: "#ffb066", mid: "#f07a22", lo: "#9a4210", flag: "#ffd23f" },
  3: { hi: "#e4e4ee", mid: "#b6b7c9", lo: "#6d6f88", flag: "#ffffff" },
};
const INK = "#0d0b18";

function makeCanvas() { const c = document.createElement("canvas"); c.width = c.height = 16; return c; }
function px(ctx, x, y, col) { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); }

// 사각형 목록으로 모양을 만들고, 테두리·명암을 자동으로 칠한다
function sprite(rects, pal, extra) {
  const c = makeCanvas(), ctx = c.getContext("2d");
  const m = Array.from({ length: 16 }, () => new Array(16).fill(0));
  for (const [x, y, w, h] of rects) for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) m[j][i] = 1;
  const on = (x, y) => x >= 0 && y >= 0 && x < 16 && y < 16 && m[y][x];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    if (on(x, y)) continue;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (on(x + dx, y + dy)) { px(ctx, x, y, INK); dy = dx = 2; }
  }
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    if (!on(x, y)) continue;
    let col = pal.mid;
    if (!on(x - 1, y) || !on(x, y - 1)) col = pal.hi;
    if (!on(x + 1, y) || !on(x, y + 1)) col = pal.lo;
    else if (y % 3 === 1 && (x + (y % 6 === 1 ? 0 : 2)) % 4 === 0) col = pal.lo;
    px(ctx, x, y, col);
  }
  if (extra) extra(ctx, pal);
  return c.toDataURL();
}

const CASTLE = [
  [1, 6, 4, 9], [1, 5, 1, 1], [3, 5, 2, 1],
  [11, 6, 4, 9], [11, 5, 2, 1], [14, 5, 1, 1],
  [5, 4, 6, 11], [5, 3, 1, 1], [7, 3, 2, 1], [10, 3, 1, 1],
];
function castleExtra(ctx, pal) {
  for (const [x, y, w, h] of [[7, 11, 2, 4], [2, 9, 1, 2], [13, 9, 1, 2], [6, 7, 1, 1], [9, 7, 1, 1]]) {
    ctx.fillStyle = INK; ctx.fillRect(x, y, w, h);
  }
  ctx.fillStyle = INK; ctx.fillRect(8, 0, 1, 3);
  ctx.fillStyle = pal.flag; ctx.fillRect(9, 0, 3, 1); ctx.fillRect(9, 1, 2, 1);
}
const TOWER = [[5, 4, 6, 11], [5, 3, 1, 1], [7, 3, 2, 1], [10, 3, 1, 1]];
function towerExtra(ctx) {
  ctx.fillStyle = INK; ctx.fillRect(7, 11, 2, 4); ctx.fillRect(7, 7, 2, 1);
}
const RUINS = [[1, 11, 4, 4], [2, 9, 2, 2], [5, 12, 4, 3], [9, 10, 3, 5], [10, 8, 1, 2], [12, 12, 3, 3]];
function ruinsExtra(ctx, pal) {
  ctx.fillStyle = INK; ctx.fillRect(13, 5, 1, 7);
  ctx.fillStyle = pal.mid; ctx.fillRect(14, 5, 2, 2);
}
function grass(seed, light) {
  const c = makeCanvas(), ctx = c.getContext("2d");
  let s = seed * 9301 + 49297;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  ctx.fillStyle = light ? "#62a851" : "#579b47"; ctx.fillRect(0, 0, 16, 16);
  for (let k = 0; k < 22; k++) px(ctx, (rnd() * 16) | 0, (rnd() * 16) | 0, rnd() < .5 ? "#4a8a3c" : "#73b85f");
  for (let k = 0; k < 3; k++) { const x = (rnd() * 14) | 0, y = (rnd() * 14 + 1) | 0; px(ctx, x, y, "#3f7a33"); px(ctx, x + 1, y - 1, "#3f7a33"); }
  if (rnd() < .25) px(ctx, (rnd() * 16) | 0, (rnd() * 16) | 0, rnd() < .5 ? "#ffe680" : "#ff9ec4");
  return c.toDataURL();
}
function banner(pal) {
  const c = makeCanvas(), ctx = c.getContext("2d");
  ctx.fillStyle = INK; ctx.fillRect(4, 2, 1, 12); ctx.fillRect(3, 13, 3, 1);
  ctx.fillRect(5, 2, 8, 1); ctx.fillRect(5, 8, 8, 1); ctx.fillRect(12, 2, 1, 7);
  ctx.fillStyle = pal.mid; ctx.fillRect(5, 3, 7, 5);
  ctx.fillStyle = pal.hi; ctx.fillRect(5, 3, 7, 1);
  ctx.fillStyle = pal.lo; ctx.fillRect(5, 7, 7, 1);
  return c.toDataURL();
}
function crown(cv) {
  const ctx = cv.getContext("2d");
  const rows = ["................", "..k....k....k...", ".kyk..kyk..kyk..", ".kyyk.kyyk.kyyk.", ".kyyykyyyykyyyk.", ".kyyyyyyyyyyyyk.", ".kyrryybbyyrryk.", ".kyrryybbyyrryk.", ".kyyyyyyyyyyyyk.", ".kooooooooooook.", ".kkkkkkkkkkkkkk."];
  const col = { k: INK, y: "#ffd23f", o: "#c99a00", r: "#ff3e4d", b: "#3b6fe0" };
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (col[ch]) px(ctx, x, y + 3, col[ch]); }));
}

const IMG = {
  castle: { 1: sprite(CASTLE, PAL[1], castleExtra), 2: sprite(CASTLE, PAL[2], castleExtra) },
  ruins: { 1: sprite(RUINS, PAL[1], ruinsExtra), 2: sprite(RUINS, PAL[2], ruinsExtra) },
  tower: sprite(TOWER, PAL[3], towerExtra),
  banner: { 1: banner(PAL[1]), 2: banner(PAL[2]) },
};
const GRASS = Array.from({ length: SZ }, (_, i) => grass(i + 7, (((i / N) | 0) + i % N) % 2 === 0));
{
  const lg = document.getElementById("logo").getContext("2d");
  const im = new Image(); im.onload = () => lg.drawImage(im, 0, 0); im.src = IMG.castle[1];
  crown(document.getElementById("crown"));
  const st = document.getElementById("stars"), sc = st.getContext("2d");
  const draw = () => {
    st.width = Math.ceil(innerWidth / 4); st.height = Math.ceil(innerHeight / 4);
    sc.fillStyle = "#17142b"; sc.fillRect(0, 0, st.width, st.height);
    let s = 42; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let k = 0; k < st.width * st.height / 260; k++) { sc.fillStyle = r() < .2 ? "#fff" : "#6f66a8"; sc.fillRect((r() * st.width) | 0, (r() * st.height) | 0, 1, 1); }
  };
  draw(); addEventListener("resize", draw);
}

// ---------- 화면 ----------
const $ = id => document.getElementById(id);
let S, history = [], thinking = false;

function img(src, cls) { const e = document.createElement("img"); e.src = src; e.alt = ""; if (cls) e.className = cls; return e; }

function newGame() {
  const b = new Int8Array(SZ);
  b[(SZ - 1) / 2] = NEUT;
  S = { b, toMove: BLUE, passes: 0, over: false, winner: 0, reason: "", last: -1, dead: [] };
  history = [];
  setMsg("");
  render();
  maybeAI();
}

const opp = () => $("opp").value;
const human = () => +$("mine").value;
const vsAI = () => opp() !== "human";
const isAITurn = () => vsAI() && !S.over && S.toMove !== human();

function snapshot() { history.push(JSON.stringify({ ...S, b: Array.from(S.b) })); }
function restore(str) { const o = JSON.parse(str); o.b = Int8Array.from(o.b); S = o; }
function setMsg(t, err) { $("msg").textContent = t; $("msg").classList.toggle("err", !!err); }

function play(i) {
  const r = tryMove(S.b, i, S.toMove);
  if (r.err) { setMsg(r.err, true); return false; }
  snapshot();
  const mover = S.toMove;
  S.b = r.board; S.last = i; S.passes = 0; S.dead = [];
  if (r.capture) {
    S.over = true; S.winner = mover; S.reason = "capture";
    for (const g of allGroups(S.b)) if (g.color !== mover && g.libs.size === 0) S.dead.push(...g.stones);
  } else S.toMove = 3 - mover;
  setMsg("");
  return true;
}

function pass() {
  snapshot();
  const who = S.toMove;
  S.passes++; S.last = -1;
  if (S.passes >= 2) {
    S.over = true; S.winner = finalWinner(S.b); S.reason = "count";
    setMsg("");
  } else {
    S.toMove = 3 - who;
    setMsg(NAME[who] + "이(가) 패스했어요. 이어서 패스하면 끝나고 영토를 셉니다.");
  }
}

function maybeAI() {
  if (!isAITurn()) return;
  thinking = true; render();
  setTimeout(() => {
    const i = aiChoose(S.b, S.toMove, opp(), S.passes === 1);
    thinking = false;
    if (i < 0) pass(); else play(i);
    render();
  }, 420);
}

function render() {
  const showT = $("tTerr").checked, showD = $("tDanger").checked, showL = $("tLibs").checked;
  const t1 = territory(S.b, BLUE), t2 = territory(S.b, ORANGE);
  const libOf = new Int16Array(SZ).fill(-1);
  for (const g of allGroups(S.b)) for (const s of g.stones) libOf[s] = g.libs.size;
  const blockMask = S.toMove === BLUE ? t2.mask : t1.mask;
  const dead = new Set(S.dead);
  const myTurn = !S.over && !thinking && !isAITurn();
  const bd = $("board");
  bd.innerHTML = "";
  for (let i = 0; i < SZ; i++) {
    const r = (i / N) | 0, c = i % N, v = S.b[i];
    const cell = document.createElement("button");
    cell.className = "cell";
    cell.style.backgroundImage = "url(" + GRASS[i] + ")";
    let label = (r + 1) + "행 " + (c + 1) + "열";
    if (v === EMPTY) {
      if (showT && (t1.mask[i] || t2.mask[i])) {
        const col = t1.mask[i] ? BLUE : ORANGE;
        cell.classList.add(col === BLUE ? "t1" : "t2");
        cell.appendChild(img(IMG.banner[col], "mark"));
        label += " " + NAME[col] + " 영토";
      }
      if (!S.over && blockMask[i]) {
        cell.classList.add("no");
        const x = document.createElement("span"); x.className = "x"; x.textContent = "✕"; cell.appendChild(x);
      } else if (myTurn) cell.classList.add("open");
    } else if (v === NEUT) {
      cell.appendChild(img(IMG.tower));
      label += " 중립 성";
    } else {
      cell.appendChild(img(dead.has(i) ? IMG.ruins[v] : IMG.castle[v]));
      label += " " + NAME[v] + " 성, 숨구멍 " + libOf[i] + "개";
      if (showL) { const n = document.createElement("span"); n.className = "libs"; n.textContent = libOf[i]; cell.appendChild(n); }
      if (showD && !S.over) {
        if (libOf[i] === 1) cell.classList.add("atari");
        else if (libOf[i] === 2) cell.classList.add("two");
      }
    }
    if (i === S.last) { cell.classList.add("last"); const p = document.createElement("span"); p.className = "pin"; cell.appendChild(p); }
    if (dead.has(i)) cell.classList.add("dead");
    cell.setAttribute("aria-label", label);
    cell.onclick = () => {
      if (S.over || thinking || isAITurn()) return;
      if (play(i)) { render(); maybeAI(); } else render();
    };
    bd.appendChild(cell);
  }

  $("sb").textContent = t1.count;
  $("so").textContent = t2.count;
  $("banB").classList.toggle("turn", !S.over && S.toMove === BLUE);
  $("banO").classList.toggle("turn", !S.over && S.toMove === ORANGE);

  const diff = t1.count - t2.count;
  $("judge").innerHTML = S.over ? "다시 하려면 <b>새 판</b>." :
    "지금 둘 다 패스하면 <b>" + NAME[diff >= 3 ? BLUE : ORANGE] + " 승</b><br>파랑−주황 " + (diff > 0 ? "+" : "") + diff + "칸 · 파랑은 +3 이상 필요";

  const tag = col => vsAI() ? (col === human() ? " · 나" : " · 컴퓨터") : "";
  const st = $("status");
  const who = S.over ? S.winner : S.toMove;
  st.innerHTML = "";
  const dot = document.createElement("i");
  dot.style.background = who === BLUE ? "var(--blue)" : "var(--orange)";
  const txt = document.createElement("span");
  txt.textContent = S.over ? NAME[S.winner] + " 승리!" : thinking ? "컴퓨터 생각 중…" : NAME[S.toMove] + " 차례" + tag(S.toMove);
  st.append(dot, txt);

  $("win").classList.toggle("show", S.over);
  if (S.over) {
    $("winTitle").textContent = vsAI() ? (S.winner === human() ? "내가 이겼다!" : "컴퓨터 승리") : NAME[S.winner] + " 승리!";
    $("winSub").textContent = S.reason === "capture"
      ? NAME[S.winner] + "이(가) 상대 성을 포위해 무너뜨렸어요."
      : "둘 다 패스 · 파랑 " + t1.count + "칸 : 주황 " + t2.count + "칸";
  }

  $("passBtn").disabled = !myTurn;
  $("undoBtn").disabled = !history.length || thinking;
}

function undo() {
  if (!history.length) return;
  restore(history.pop());
  if (vsAI()) while (history.length && S.toMove !== human()) restore(history.pop());
  setMsg("");
  render();
  maybeAI();
}

$("newBtn").onclick = newGame;
$("againBtn").onclick = newGame;
$("passBtn").onclick = () => { pass(); render(); maybeAI(); };
$("undoBtn").onclick = undo;
$("opp").onchange = newGame;
$("mine").onchange = newGame;
["tTerr", "tDanger", "tLibs"].forEach(id => $(id).onchange = render);
newGame();
</script>
